<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart School — Электронный дневник класса</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<!-- Подключаем Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // Конфигурация вашего проекта Firebase
  const firebaseConfig = {
    apiKey: "AIzaSyAp7TRF8uRTjBODKENjZJ_jh8AZXNzQP8I",
    authDomain: "home-work-3ab5c.firebaseapp.com",
    projectId: "home-work-3ab5c",
    storageBucket: "home-work-3ab5c.firebasestorage.app",
    messagingSenderId: "441733594051",
    appId: "1:441733594051:web:a340f0569ed1719a4c5b76",
    measurementId: "G-S1Z2Q43SLJ"
  };

  // Инициализация Firebase
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // Делаем функции доступными глобально в скрипте
  window.db = db;
  window.colRef = collection(db, "posts");
  window.onSnapshot = onSnapshot;
  window.addDoc = addDoc;
  window.updateDoc = updateDoc;
  window.deleteDoc = deleteDoc;
  window.doc = doc;
  window.getDocs = getDocs;

  // Запуск приложения после инициализации базы
  window.initAppCloud();
</script>

<style>
:root {
  --bg: #DAF1DE;
  --card: #ffffff;
  --card2: #eef8f0;
  --bd: #c3dfca;
  --tx: #051F20;
  --mut: #4d6b61;
  --ac: #235347;
  --acf: #ffffff;
  --soft: #8EB69B;
  color-scheme: light;
  box-sizing: border-box;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #051F20;
    --card: #0B2B26;
    --card2: #163832;
    --bd: #235347;
    --tx: #DAF1DE;
    --mut: #8EB69B;
    --ac: #8EB69B;
    --acf: #051F20;
    --soft: #235347;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #051F20;
  --card: #0B2B26;
  --card2: #163832;
  --bd: #235347;
  --tx: #DAF1DE;
  --mut: #8EB69B;
  --ac: #8EB69B;
  --acf: #051F20;
  --soft: #235347;
  color-scheme: dark;
}
html, body {
  background: var(--bg);
  color: var(--tx);
  font-family: -apple-system, "SF Pro Text", Roboto, "Segoe UI", sans-serif;
  margin: 0;
}
.card { background: var(--card); border: 1px solid var(--bd); border-radius: 18px; }
.card2 { background: var(--card2); border-radius: 14px; }
.mut { color: var(--mut); }
.btn { background: var(--ac); color: var(--acf); border-radius: 14px; font-weight: 600; padding: 12px 16px; transition: .15s; }
.btn:active { transform: scale(.97); }
.chip { padding: 8px 12px; border-radius: 12px; background: var(--card); border: 1px solid var(--bd); white-space: nowrap; font-size: 13px; transition: .15s; cursor: pointer; }
.chip.on { background: var(--ac); color: var(--acf); border-color: var(--ac); }
.inp { width: 100%; background: var(--card2); border: 1px solid var(--bd); border-radius: 12px; padding: 10px 12px; color: var(--tx); outline: none; font-size: 15px; }
.inp:focus { border-color: var(--ac); }
.hw { transition: .35s; }
.hw.done { opacity: .65; }
.hw.done .ttl, .hw.done .txt { text-decoration: line-through; }
.ck { width: 28px; height: 28px; border-radius: 9px; border: 2px solid var(--ac); display: grid; place-items: center; color: var(--acf); transition: .2s; flex: none; cursor: pointer; }
.done .ck { background: var(--ac); }
.fade { animation: f .3s; }
@keyframes f { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; } }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
</style>
</head>
<body>

<!-- Всплывающее окно входа -->
<div id="login-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
  <div class="card p-6 max-w-sm w-full space-y-4 fade">
    <div class="text-center">
      <div class="font-bold text-xl flex items-center justify-center gap-2 mb-1">
        <span style="color:var(--ac)" id="modal-logo"></span>Smart School
      </div>
      <p class="text-xs mut">Представьтесь для входа в дневник</p>
    </div>
    
    <form id="login-form" class="space-y-3">
      <div>
        <label class="text-xs mut block mb-1">Кто вы?</label>
        <select id="role-select" class="inp">
          <option value="student">Ученик / Ученица</option>
          <option value="teacher">Учитель</option>
        </select>
      </div>

      <div id="input-box">
        <label class="text-xs mut block mb-1" id="input-label">Фамилия и Имя</label>
        <input type="text" id="user-input" class="inp" placeholder="например: Соболенко Анисия" required>
      </div>

      <button type="submit" class="btn w-full mt-2">Войти в дневник</button>
    </form>
  </div>
</div>

<div class="max-w-xl mx-auto min-h-screen pb-24">
  <header class="sticky top-0 z-10 px-4 pt-3 pb-3" style="background:var(--bg)">
    <div class="flex items-center justify-between gap-2">
      <div class="font-bold text-lg flex items-center gap-2">
        <span style="color:var(--ac)" id="logo"></span>Smart School
      </div>
      <div class="flex items-center gap-2">
        <button id="switch-user" class="chip !p-2 text-xs flex items-center gap-1" title="Сменить профиль"></button>
        <button id="theme" class="chip !p-2" aria-label="Тема"></button>
      </div>
    </div>
  </header>

  <main id="app" class="px-4 space-y-4 mt-4"></main>
</div>

<div id="toast" class="fixed left-1/2 -translate-x-1/2 bottom-6 px-4 py-3 rounded-2xl text-sm font-medium opacity-0 pointer-events-none transition z-50" style="background:var(--ac);color:var(--acf)"></div>

<script>
const P = {
  book:'<path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  trash:'<path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
  clip:'<path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/>',
  moon:'<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
  mega:'<path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/>',
  send:'<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
  clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  user:'<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  cap:'<path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/>',
  plus:'<path d="M5 12h14M12 5v14"/>',
  image:'<rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>'
};
const ic = n => `<svg class="i" viewBox="0 0 24 24">${P[n]}</svg>`;

const SUBJ = ['Математика', 'Человек и мир', 'Обучение грамоте (Обучение чтению)', 'Беларуская мова',];
const TEACHER_CODE = '2026'; // Секретный код учителя

let S = {
  user: JSON.parse(localStorage.getItem('smartschool_user')) || null,
  theme: null,
  tab: 'hw',
  photoBase64: null,
  hw: []
};

const saveUser = () => { localStorage.setItem('smartschool_user', JSON.stringify(S.user)); };
const $ = s => document.querySelector(s);

function toast(m) {
  const t = $('#toast');
  t.textContent = m;
  t.style.opacity = 1;
  clearTimeout(toast.t);
  toast.t = setTimeout(() => t.style.opacity = 0, 2200);
}

function theme() {
  let t = S.theme || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');
  document.documentElement.dataset.theme = t;
  $('#theme').innerHTML = ic(t === 'dark' ? 'sun' : 'moon');
  return t;
}
$('#theme').onclick = () => { S.theme = theme() === 'dark' ? 'light' : 'dark'; theme(); };

$('#logo').innerHTML = ic('cap');
$('#modal-logo').innerHTML = ic('cap');
$('#switch-user').innerHTML = ic('user');

const roleSelect = $('#role-select');
const userInput = $('#user-input');
const inputLabel = $('#input-label');

roleSelect.onchange = (e) => {
  if (e.target.value === 'teacher') {
    inputLabel.textContent = 'Секретный код учителя';
    userInput.type = 'password';
    userInput.value = '';
    userInput.placeholder = 'Введите код доступа';
  } else {
    inputLabel.textContent = 'Фамилия и Имя';
    userInput.type = 'text';
    userInput.value = '';
    userInput.placeholder = 'например: Соболенко Лика';
  }
};

$('#login-form').onsubmit = (e) => {
  e.preventDefault();
  const role = roleSelect.value;
  const val = userInput.value.trim();

  if (role === 'teacher') {
    if (val !== TEACHER_CODE) {
      toast('Неверный код учителя!');
      return;
    }
    S.user = { name: 'Учитель класса', role: 'teacher' };
  } else {
    if (!val) return;
    S.user = { name: val, role: 'student' };
  }

  saveUser();
  $('#login-modal').classList.add('hidden');
  render();
};

$('#switch-user').onclick = () => {
  S.user = null;
  saveUser();
  checkAuth();
};

function checkAuth() {
  if (!S.user) {
    $('#login-modal').classList.remove('hidden');
  } else {
    $('#login-modal').classList.add('hidden');
  }
}


// Константа 30 дней в миллисекундах
const THIRTY_DAYS_MS = 30 * 24 * 60 * 60 * 1000;

// Функция инициализации связи с Firebase Firestore с автоочисткой
window.initAppCloud = function() {
  theme();
  checkAuth();

  // Слушаем изменения в базе данных в реальном времени
  window.onSnapshot(window.colRef, (snapshot) => {
    S.hw = [];
    const now = Date.now();

    snapshot.forEach((docSnap) => {
      const data = docSnap.data();
      const docId = docSnap.id;
      const createdAt = data.createdAt || 0;

      // Проверка: прошло ли 30 дней с момента создания
      if (createdAt > 0 && (now - createdAt > THIRTY_DAYS_MS)) {
        
        // --- ВАРИАНТ А: Удаляем только фото (оставляем текст) ---
        if (data.photo) {
          const docRef = window.doc(window.db, "posts", docId);
          window.updateDoc(docRef, { photo: null }).catch(err => console.error("Ошибка очистки фото:", err));
          data.photo = null; // очищаем локально для отображения
        }
      }

      S.hw.push({ id: docId, ...data });
    });

    // Сортировка по времени (новые сверху)
    S.hw.sort((a, b) => b.createdAt - a.createdAt);
    render();
  }, (error) => {
    console.error("Ошибка загрузки из базы:", error);
    toast("Ошибка подключения к базе данных");
  });
};

async function togHW(id) {
  if (!S.user || S.user.role !== 'student') return;
  const item = S.hw.find(x => x.id === id);
  if (!item) return;

  let completedBy = item.completedBy || [];
  const idx = completedBy.indexOf(S.user.name);
  
  if (idx > -1) {
    completedBy.splice(idx, 1);
  } else {
    completedBy.push(S.user.name);
    toast('Задание отмечено как выполненное');
  }

  const docRef = window.doc(window.db, "posts", id);
  await window.updateDoc(docRef, { completedBy });
}

async function delHW(id) {
  if (!S.user || S.user.role !== 'teacher') return;
  if (!confirm('Удалить эту запись?')) return;
  
  await window.deleteDoc(window.doc(window.db, "posts", id));
  toast('Запись удалена');
}

function hwCard(h) {
  const isStudent = S.user && S.user.role === 'student';
  const isTeacher = S.user && S.user.role === 'teacher';
  const completedBy = h.completedBy || [];
  const isDone = isStudent && completedBy.includes(S.user.name);

  return `
    <div class="hw card p-4 fade ${isDone ? 'done' : ''}">
      <div class="flex items-start gap-3">
        ${isStudent && h.type === 'hw' ? `
          <button class="ck mt-0.5" onclick="togHW('${h.id}')" aria-label="Сделано">
            ${isDone ? ic('check') : ''}
          </button>
        ` : ''}
        
        <div class="flex-1 min-w-0">
          <div class="flex justify-between items-center gap-2">
            <span class="chip !py-0.5 !px-2.5 !text-xs font-semibold ${h.type === 'news' ? 'on' : ''}">
              ${h.type === 'news' ? '📢 Объявление' : h.subj}
            </span>
            ${isTeacher ? `
              <button class="mut hover:text-red-500" onclick="delHW('${h.id}')">${ic('trash')}</button>
            ` : ''}
          </div>

          <p class="txt text-sm mt-2.5 font-medium leading-relaxed">${h.text}</p>

          ${h.photo ? `
            <div class="mt-3 rounded-xl overflow-hidden border border-[var(--bd)] max-h-64 bg-black/5">
              <img src="${h.photo}" alt="Фото" class="w-full h-full object-cover cursor-pointer" onclick="window.open('${h.photo}')">
            </div>
          ` : ''}

          <div class="mt-3 pt-2.5 border-t border-[var(--bd)] flex items-center justify-between text-xs mut">
            <span>Выполнили: <b>${completedBy.length}</b> учеников</span>
            ${isTeacher && completedBy.length > 0 ? `
              <span class="truncate max-w-[180px]" title="${completedBy.join(', ')}">${completedBy.join(', ')}</span>
            ` : ''}
          </div>
        </div>
      </div>
    </div>
  `;
}

function studentView() {
  const hwList = S.hw.filter(x => S.tab === 'hw' ? x.type === 'hw' : x.type === 'news');
  const doneCount = S.hw.filter(x => x.type === 'hw' && (x.completedBy || []).includes(S.user.name)).length;
  const totalHW = S.hw.filter(x => x.type === 'hw').length;

  return `
    <div class="card p-4 fade mb-4">
      <div class="flex items-center justify-between">
        <div>
          <div class="font-bold text-lg">${S.user.name}</div>
          <div class="text-xs mut">Ученик класса</div>
        </div>
        <div class="text-right">
          <div class="text-xs mut">Выполнено</div>
          <div class="font-bold text-sm" style="color:var(--ac)">${doneCount} из ${totalHW}</div>
        </div>
      </div>
    </div>

    <div class="flex gap-2 mb-4">
      <button class="chip flex-1 ${S.tab === 'hw' ? 'on' : ''}" onclick="S.tab='hw';render()">Домашнее задание</button>
      <button class="chip flex-1 ${S.tab === 'news' ? 'on' : ''}" onclick="S.tab='news';render()">Объявления</button>
    </div>

    <div class="space-y-3">
      ${hwList.map(h => hwCard(h)).join('') || `<div class="card p-8 text-center mut">${ic('check')}<div class="mt-2">Записей нет</div></div>`}
    </div>
  `;
}

function teacherView() {
  return `
    <div class="card p-4 mb-4 fade">
      <div class="font-bold text-base flex items-center gap-2 mb-1">
        ${ic('user')} Панель Учителя
      </div>
      <p class="text-xs mut">Публикуйте задания и следите за выполнением в реальном времени.</p>
    </div>

    <form class="card p-4 space-y-3 fade mb-4" onsubmit="pubHW(event)">
      <div class="font-bold text-sm flex items-center gap-2">
        ${ic('plus')} Новая публикация
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-xs mut block mb-1">Тип</label>
          <select id="p-type" class="inp" onchange="$('#subj-box').style.display = this.value === 'news' ? 'none' : 'block'">
            <option value="hw">📚 Домашнее задание</option>
            <option value="news">📢 Объявление</option>
          </select>
        </div>
        <div id="subj-box">
          <label class="text-xs mut block mb-1">Предмет</label>
          <select id="p-subj" class="inp">
            ${SUBJ.map(s => `<option value="${s}">${s}</option>`).join('')}
          </select>
        </div>
      </div>

      <div>
        <label class="text-xs mut block mb-1">Текст задания / сообщения</label>
        <textarea id="p-text" rows="3" required class="inp" placeholder="Введите подробности задания..."></textarea>
      </div>

      <div>
        <label class="chip flex items-center justify-center gap-2 w-full text-center cursor-pointer" id="photo-label">
          ${ic('image')} <span id="photo-text">Прикрепить фото с доски/учебника</span>
          <input type="file" accept="image/*" class="hidden" onchange="handlePhoto(this)">
        </label>
      </div>

      <button type="submit" class="btn w-full flex items-center justify-center gap-2">
        ${ic('send')} Опубликовать в облако
      </button>
    </form>

    <div class="font-bold pt-2 mb-2 text-sm flex items-center justify-between">
      <span>История публикаций и отчеты</span>
      <span class="text-xs mut">${S.hw.length} записей</span>
    </div>

    <div class="space-y-3">
      ${S.hw.map(h => hwCard(h)).join('') || '<div class="mut text-center p-6 card">Нет публикаций</div>'}
    </div>
  `;
}

function handlePhoto(input) {
  if (input.files && input.files[0]) {
    const reader = new FileReader();
    reader.onload = function(e) {
      S.photoBase64 = e.target.result;
      $('#photo-text').textContent = 'Фото прикреплено!';
      $('#photo-label').classList.add('on');
    };
    reader.readAsDataURL(input.files[0]);
  }
}

async function pubHW(e) {
  e.preventDefault();
  if (!S.user || S.user.role !== 'teacher') return;

  const type = $('#p-type').value;
  const subj = $('#p-subj') ? $('#p-subj').value : 'Объявление';
  const text = $('#p-text').value.trim();

  if (!text) return;

  try {
    await window.addDoc(window.colRef, {
      type,
      subj,
      text,
      photo: S.photoBase64 || null,
      completedBy: [],
      createdAt: Date.now()
    });

    S.photoBase64 = null;
    $('#p-text').value = '';
    $('#photo-text').textContent = 'Прикрепить фото с доски/учебника';
    $('#photo-label').classList.remove('on');
    toast('Успешно опубликовано в облако!');
  } catch (err) {
    console.error("Ошибка отправки:", err);
    toast("Ошибка публикации. Проверьте интернет.");
  }
}

function render() {
  checkAuth();
  if (!S.user) return;
  $('#app').innerHTML = S.user.role === 'student' ? studentView() : teacherView();
}
</script>
</body>
</html>
